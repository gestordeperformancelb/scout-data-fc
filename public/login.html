<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acesso — Scout Data F.C.</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--verde:#1a3d1a;--verde-lt:#4caf50;--ouro:#c9a227;--ouro-lt:#f0c040;--preto:#080d08;--branco:#f4f9f4;--cinza:#8a9a8a}
body{font-family:'DM Sans',sans-serif;background:var(--preto);color:var(--branco);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem}

/* Background sutil */
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(26,61,26,.6) 0%,transparent 65%);pointer-events:none}

.card{background:#0d1a0d;border:1px solid #1a3d1a;border-radius:16px;padding:2.5rem 2rem;width:100%;max-width:420px;position:relative;z-index:1}

.logo{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--ouro);letter-spacing:3px;text-align:center;margin-bottom:.25rem}
.logo span{color:var(--verde-lt)}
.subtitle{text-align:center;font-size:.78rem;color:var(--cinza);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2rem}

h2{font-size:1.15rem;font-weight:700;margin-bottom:.4rem;text-align:center}
.desc{font-size:.85rem;color:var(--cinza);text-align:center;margin-bottom:1.75rem;line-height:1.5}

label{display:block;font-size:.8rem;font-weight:600;color:var(--cinza);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.05em}
input[type=email]{width:100%;background:#111b11;border:1px solid #2d6a2d;color:var(--branco);border-radius:8px;padding:.75rem 1rem;font-size:.95rem;font-family:inherit;outline:none;transition:border-color .2s}
input[type=email]:focus{border-color:var(--ouro)}
input[type=email]::placeholder{color:#4a6a4a}

.btn{width:100%;background:var(--ouro);color:#080d08;border:none;border-radius:8px;padding:.9rem;font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:.1em;cursor:pointer;margin-top:1rem;transition:background .2s}
.btn:hover:not(:disabled){background:var(--ouro-lt)}
.btn:disabled{opacity:.6;cursor:not-allowed}

.msg{margin-top:1.25rem;padding:.85rem 1rem;border-radius:8px;font-size:.85rem;text-align:center;display:none;line-height:1.5}
.msg.ok{background:rgba(76,175,80,.15);border:1px solid rgba(76,175,80,.3);color:#a5d6a7;display:block}
.msg.erro{background:rgba(244,67,54,.12);border:1px solid rgba(244,67,54,.3);color:#ef9a9a;display:block}

.divider{display:flex;align-items:center;gap:.75rem;margin:1.5rem 0}
.divider hr{flex:1;border:none;border-top:1px solid #1a3d1a}
.divider span{color:#4a6a4a;font-size:.75rem;white-space:nowrap}

.cta-comprar{display:block;text-align:center;background:transparent;border:1px solid var(--ouro);color:var(--ouro);border-radius:8px;padding:.75rem;font-size:.85rem;font-weight:600;text-decoration:none;transition:all .2s}
.cta-comprar:hover{background:rgba(201,162,39,.1)}

.erro-badge{background:rgba(244,67,54,.12);border:1px solid rgba(244,67,54,.3);color:#ef9a9a;border-radius:8px;padding:.7rem 1rem;font-size:.82rem;text-align:center;margin-bottom:1.25rem;display:none}
.erro-badge.show{display:block}

.voltar{display:block;text-align:center;color:var(--cinza);font-size:.78rem;margin-top:1.25rem;text-decoration:none;transition:color .2s}
.voltar:hover{color:var(--ouro)}
</style>
</head>
<body>

<div class="card">
  <div class="logo">Scout Data <span>F.C.</span></div>
  <div class="subtitle">Copa do Mundo 2026</div>

  <div class="erro-badge" id="erro-badge"></div>

  <h2>Acessar o Painel</h2>
  <p class="desc">Digite o email usado na compra para receber seu link de acesso.</p>

  <form id="form" onsubmit="enviar(event)">
    <label for="email">Seu email</label>
    <input type="email" id="email" placeholder="seu@email.com" required autocomplete="email">
    <button type="submit" class="btn" id="btn">ENVIAR LINK DE ACESSO</button>
  </form>

  <div class="msg" id="msg"></div>

  <div class="divider"><hr><span>Ainda não tem acesso?</span><hr></div>
  <a href="/" class="cta-comprar">⚽ Quero comprar o acesso</a>

  <a href="/" class="voltar">← Voltar para o site</a>
</div>

<script>
// Mostra erro da URL (ex: redirect do /api/acesso)
const params = new URLSearchParams(location.search);
const erroParam = params.get('erro');
const erroMsg = {
  token_invalido: 'Link de acesso inválido ou expirado. Solicite um novo abaixo.',
  acesso_negado: 'Acesso negado. Verifique se seu email tem acesso ativo.',
  erro_interno: 'Erro interno. Tente novamente em instantes.',
};
if (erroParam && erroMsg[erroParam]) {
  const el = document.getElementById('erro-badge');
  el.textContent = '⚠️ ' + erroMsg[erroParam];
  el.classList.add('show');
}

async function enviar(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const btn   = document.getElementById('btn');
  const msg   = document.getElementById('msg');

  btn.disabled = true;
  btn.textContent = 'ENVIANDO...';
  msg.className = 'msg';
  msg.style.display = 'none';

  try {
    await fetch('/api/magic-link', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });

    // Sempre mostra sucesso (segurança: não revelamos se email existe)
    msg.textContent = '✅ Se este email tiver um acesso ativo, você receberá o link em instantes. Verifique também a caixa de spam.';
    msg.className = 'msg ok';
    document.getElementById('form').style.display = 'none';

  } catch {
    msg.textContent = '❌ Erro de conexão. Tente novamente.';
    msg.className = 'msg erro';
    btn.disabled = false;
    btn.textContent = 'ENVIAR LINK DE ACESSO';
  }
}
</script>
</body>
</html>
